name: Instagram automático

on:
  schedule:
    # O agendador do GitHub atrasa/pula execuções, então roda a cada 15 min e o
    # script publica o que estiver vencido na AGENDA (post_instagram.py):
    # reels 09:00 e 19:00, carrossel 12:00 (horário de Brasília).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # rodar manualmente pela aba Actions
    inputs:
      fila:
        description: "auto = o que estiver vencido na agenda; reels/carrosseis = publicar um extra agora"
        type: choice
        options: [auto, reels, carrosseis]
        default: auto
      dry_run:
        description: "Só simular (não publica)"
        type: boolean
        default: false

permissions:
  contents: write # para registrar o que foi publicado

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar próximo post da fila
        env:
          FILA: ${{ inputs.fila || 'auto' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python post_instagram.py "$FILA"

      - name: Registrar post como publicado
        run: |
          git add -A posts
          if git diff --cached --quiet; then
            echo "Nada para registrar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publicado no Instagram em $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
